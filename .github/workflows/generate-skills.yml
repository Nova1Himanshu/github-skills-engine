name: Generate skill drafts

on:
  workflow_dispatch:
    inputs:
      max_drafts:
        description: "Maximum source drafts to process (1-5)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate project
        run: |
          python -m py_compile scripts/generate_skill_drafts.py scripts/validate_library.py
          python scripts/validate_library.py
      - name: Generate skill drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          MAX_DRAFTS: ${{ inputs.max_drafts }}
        run: python scripts/generate_skill_drafts.py
      - name: Create review pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ai-generated-skills
          delete-branch: true
          title: "feat: add AI-generated skill drafts"
          commit-message: "feat: add AI-generated skill drafts"
          body: |
            Generated skill candidates from source documentation.
            These are unapproved drafts; review accuracy, provenance, safety,
            license compatibility, and attribution before merging.
