name: Sync skills

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/sources.json"
      - "scripts/sync_repositories.py"
      - "scripts/prepare_chatgpt_packets.py"
      - ".github/workflows/sync-skills.yml"
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python and skill library
        run: |
          python -m py_compile scripts/sync_repositories.py scripts/prepare_chatgpt_packets.py scripts/validate_library.py
          python scripts/validate_library.py

      - name: Discover and import source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_repositories.py

      - name: Prepare ChatGPT Plus prompt packets without an API
        env:
          PACKET_LIMIT: "5"
        run: python scripts/prepare_chatgpt_packets.py

      - name: Create review pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/skill-sync
          delete-branch: true
          title: "chore: sync GitHub skill sources"
          commit-message: "chore: sync GitHub skill sources"
          body: |
            Automated discovery plus offline ChatGPT prompt-packet preparation.
            No model API is called. Review source licenses and imported instructions before merging.
